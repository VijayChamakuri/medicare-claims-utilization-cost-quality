# dbt layer over the validated DuckDB SQL. Models are generated from sql/ by scripts/gen_dbt_models.py.
# Vars default to config/project.yml (sample1); the runner passes the active profile's values.
name: medicare_claims
version: 1.0.0
config-version: 2
profile: medicare_claims
model-paths:
- models
macro-paths:
- macros
test-paths:
- tests
target-path: target
clean-targets:
- target
- logs
on-run-start:
- '{{ create_claims_sql_macros() }}'
vars:
  study_start: '2008-01-01'
  study_end: '2010-12-31'
  readmission_days: 30
  ed_codes:
  - '99281'
  - '99282'
  - '99283'
  - '99284'
  - '99285'
  top_share_percent: 5.0
  peer_min_providers: 20
  min_claims: 30
  iqr_multiplier: 3.0
  comorb_low_max: 1
  comorb_medium_max: 3
  adm_one: 2
  adm_two_plus: 3
  paid_medium_min: 1000.0
  paid_high_min: 5000.0
  tier_low_max: 1
  tier_medium_max: 3
