    owner: {name: Vijay Chamakuri}
    depends_on:
      - ref('mart_utilization_monthly')
      - ref('mart_payment_monthly')
      - ref('mart_provider_performance')
      - ref('mart_quality_monitoring')
      - ref('mart_member_risk')
