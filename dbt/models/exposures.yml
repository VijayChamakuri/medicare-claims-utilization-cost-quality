      - ref('mart_payment_concentration')
      - ref('mart_demographic_summary')
      - ref('mart_quality_monitoring')
      - ref('mart_condition_summary')
      - ref('mart_provider_performance')
      - ref('reconciliation_results')
  - name: excel_claims_operations_review
    label: Excel claims operations review
    type: analysis
    maturity: medium
