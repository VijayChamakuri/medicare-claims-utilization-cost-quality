[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicare-claims-utilization-cost-quality"
version = "1.0.0"
description = "Utilization, payment and quality-monitoring analytics on CMS DE-SynPUF synthetic Medicare claims, with SQL, Excel and BI exports."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "pyyaml>=6,<7",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6,<7",
  "types-openpyxl>=3.1,<4",
  "pillow>=10,<13",
  "dbt-core>=1.8,<2",
  "dbt-duckdb>=1.8,<2",
  "tableauhyperapi>=0.0.24000,<0.0.26500",
  "formulas>=1.2,<2",
]

[project.scripts]
medicare-claims = "medicare_claims.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pandas.*", "tableauhyperapi.*"]
ignore_missing_imports = true
